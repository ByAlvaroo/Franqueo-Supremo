# Cada vez que subes cambios, GitHub crea FranqueoSupremo.exe y lo publica en "Releases".
# La app lo detecta sola y se actualiza.   HECHO POR @BYALVARO__
name: Crear FranqueoSupremo.exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Numero de version
        id: v
        shell: pwsh
        run: |
          $base = (Get-Content version.txt -Raw).Trim()
          $ver = "$base.${{ github.run_number }}"
          "version=$ver" >> $env:GITHUB_OUTPUT
          @{ version = $ver; repo = "${{ github.repository }}" } | ConvertTo-Json | Set-Content -Encoding utf8 codigo/build_info.json
          Get-Content codigo/build_info.json

      - name: Instalar piezas
        run: python -m pip install openpyxl pyinstaller

      - name: Crear el .exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name FranqueoSupremo --icon codigo/icono.ico --hidden-import openpyxl --add-data "codigo/build_info.json;." codigo/franqueo_supremo.py

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Franqueo Supremo ${{ steps.v.outputs.version }}
          body: |
            Descarga **FranqueoSupremo.exe** y ponlo en la misma carpeta que tu `Mis_Sellos.xlsx`.
            Si ya tienes la app, se actualiza sola al abrirla.
          files: dist/FranqueoSupremo.exe
          make_latest: true
